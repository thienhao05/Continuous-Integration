name: CI with GitHub Actions using Ant and JUnit

# This workflow will build a Java project with Ant
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-ant

on:
  push:
    branches: [ main ] # Lấy code từ nhánh main nếu có ai push code lên  
  pull_request:
    branches: [ main ] # Lấy code từ nhánh main nếu có ai gửi pull request  

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs: # Những công việc dev làm thường ngày: lấy code, build, chạy test, đóng gói, gửi build...
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Check-out repository # Lấy code từ kho thảy vào máy ảo của GitHub chuẩn bị build ở bước sau
        uses: actions/checkout@v4

      - name: Set up JDK 18 
        uses: actions/setup-java@v4 # Khai báo cần dùng JDK để build
        with:
          java-version: '18' # Khai báo sử dụng phiên bản JDK 18 để build
          distribution: 'temurin'

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Build project with Ant
        run: ant -noinput -buildfile build.xml clean test jar # Quá trình build sẽ cần đến file cấu hình build.xml, build-impl.xml

      - name: Make hyperlink to jar-war file # Tạo hyperlink để download build 
        uses: actions/upload-artifact@v4
        with:
          name: math-util-ant-jar
          path: dist/*.jar
          if-no-files-found: error

# End of CI workflow file
